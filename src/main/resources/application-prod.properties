# Production profile (Req 32.5)
# All sensitive/environment-specific configuration MUST come from environment
# variables. No secrets are committed to source control (Req 32.4).

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway owns the schema; Hibernate validates only (Req 30.1, 30.2)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Required secrets (no defaults; startup fails fast if unset)
lifeadmin.security.jwt-secret=${JWT_SECRET}

lifeadmin.storage.path=${FILE_STORAGE_PATH}

# AI provider configuration
lifeadmin.ai.provider=${AI_PROVIDER}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
lifeadmin.ai.gemini.api-key=${GEMINI_API_KEY:}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# Restrict actuator exposure in production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.LifeAdmin=INFO
