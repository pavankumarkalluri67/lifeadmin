# Automated test profile (Req 32.5)
# Integration tests supply the database (e.g. Testcontainers) and override these values.

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lifeadmin_test}
spring.datasource.username=${DATABASE_USERNAME:lifeadmin}
spring.datasource.password=${DATABASE_PASSWORD:lifeadmin}

# Keep schema authority with Flyway even under test (Req 30.1, 30.2)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Deterministic secret for tests
lifeadmin.security.jwt-secret=${JWT_SECRET:test-secret-0123456789abcdef0123456789abcdef}

# Isolated, disposable storage location for tests
lifeadmin.storage.path=${FILE_STORAGE_PATH:./target/test-documents}

# AI provider is stubbed/mocked in tests by default
lifeadmin.ai.provider=${AI_PROVIDER:ollama}

logging.level.root=WARN
logging.level.com.LifeAdmin=INFO
