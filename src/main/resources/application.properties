spring.application.name=lifeadmin

# Default active profile (override with SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---------------------------------------------------------------------------
# Datasource (env-driven; see Requirement 32.3)
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lifeadmin}
spring.datasource.username=${DATABASE_USERNAME:lifeadmin}
spring.datasource.password=${DATABASE_PASSWORD:lifeadmin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate: schema is owned by Flyway, Hibernate only validates (Req 30.1, 30.2)
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Flyway (Req 30.1)
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# File upload limits (Req 7.4 default 10 MiB)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10485760
spring.servlet.multipart.max-request-size=10485760

# ---------------------------------------------------------------------------
# Security / tokens (Req 32.3)
# ---------------------------------------------------------------------------
lifeadmin.security.jwt-secret=${JWT_SECRET:}
lifeadmin.security.access-token-ttl=15m
lifeadmin.security.refresh-token-ttl=30d

# ---------------------------------------------------------------------------
# Storage (Req 32.3, 35)
# ---------------------------------------------------------------------------
lifeadmin.storage.path=${FILE_STORAGE_PATH:./data/documents}

# ---------------------------------------------------------------------------
# AI provider selection (Req 22, 32.3)
# ---------------------------------------------------------------------------
lifeadmin.ai.provider=${AI_PROVIDER:ollama}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
lifeadmin.ai.gemini.api-key=${GEMINI_API_KEY:}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# Obligation confidence thresholds (Req 15.4)
lifeadmin.obligation.high-confidence-threshold=0.90
lifeadmin.obligation.review-threshold=0.70
lifeadmin.obligation.default-priority=MEDIUM

# ---------------------------------------------------------------------------
# Actuator (Req 32.2)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# API surface (Req 31.1) and CORS (Req 31.2)
# ---------------------------------------------------------------------------
lifeadmin.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
