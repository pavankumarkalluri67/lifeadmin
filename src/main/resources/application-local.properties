# Local development profile (Req 32.5)
# Convenient defaults for a developer machine; all values may be overridden via env vars.

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/lifeadmin-ai
spring.datasource.username=${POSTGRES_USER:platform}
spring.datasource.password=${DATABASE_PASSWORD:8BCF-A6CC55D89593}

# Schema is still managed by Flyway; Hibernate validates only (Req 30.2)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Development-friendly JWT secret fallback (override with JWT_SECRET in real use)
lifeadmin.security.jwt-secret=${JWT_SECRET:local-development-secret-change-me-0123456789abcdef}

lifeadmin.storage.path=${FILE_STORAGE_PATH:./data/documents}

logging.level.com.LifeAdmin=DEBUG
